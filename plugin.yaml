# MemPalace Memory Plugin — config-activated retrieval provider + native MemPalace tool bridge
name: mempalace_memory
version: "1.7.0"
description: "Production-hardened Hermes MemoryProvider for MemPalace v3.5.0: modular refactor (config/api/retrieval/provider), native bridge for the full MemPalace tool surface including v3.5.0 hallways management, text-based entity detection, bounded recall, diagnostics, safe cache/thread lifecycle, optional ingestion, optional memory mirroring, optional Holographic overlay, KG-assisted recall, and session-end transcript archival."
author: Jupiter
kind: exclusive
requires_env: []
provides_tools:
  - mempalace_status
  - mempalace_list_wings
  - mempalace_list_rooms
  - mempalace_get_taxonomy
  - mempalace_get_aaak_spec
  - mempalace_kg_query
  - mempalace_kg_add
  - mempalace_kg_invalidate
  - mempalace_kg_timeline
  - mempalace_kg_stats
  - mempalace_traverse
  - mempalace_find_tunnels
  - mempalace_graph_stats
  - mempalace_create_tunnel
  - mempalace_list_tunnels
  - mempalace_delete_tunnel
  - mempalace_list_hallways
  - mempalace_delete_hallway
  - mempalace_follow_tunnels
  - mempalace_search
  - mempalace_check_duplicate
  - mempalace_add_drawer
  - mempalace_delete_drawer
  - mempalace_sync
  - mempalace_get_drawer
  - mempalace_list_drawers
  - mempalace_update_drawer
  - mempalace_diary_write
  - mempalace_diary_read
  - mempalace_hook_settings
  - mempalace_memories_filed_away
  - mempalace_reconnect
  - mempalace_repair_scan
  - mempalace_repair_prune
  - mempalace_export
  - mempalace_dedup_stats
  - mempalace_dedup_run
  - mempalace_detect_entities
  - mempalace_dynamics_apply
  - mempalace_potentiate
provides_hooks: [on_session_start, on_session_end]
provides_memory_provider: mempalace
